<style>
:root{--bg:#14121f;--panel:#241d33;--cell:#342a47;--cell2:#3d3253;--ink:#f2e8d5;--dim:#a99bb8;--lamp:#ffb347;--red:#c8402f;--ok:#7bc96f;--line:#0b0912;--awn1:#c8402f;--awn2:#f2e8d5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Do Hyeon','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:15px;min-height:100vh;
background-image:radial-gradient(circle at 50% -10%,#3a2a4f 0,transparent 60%)}
.awning{height:44px;background:repeating-linear-gradient(90deg,var(--awn1) 0 28px,var(--awn2) 28px 56px);border-bottom:4px solid var(--line);position:relative;margin-bottom:14px}
.awning:after{content:"";position:absolute;left:0;right:0;top:100%;height:12px;background:repeating-linear-gradient(90deg,var(--awn1) 0 28px,var(--awn2) 28px 56px);
-webkit-mask:radial-gradient(circle 14px at 14px 0,#000 98%,transparent) 0 0/28px 12px repeat-x;mask:radial-gradient(circle 14px at 14px 0,#000 98%,transparent) 0 0/28px 12px repeat-x}
.lamp{position:absolute;top:100%;width:14px;height:20px;background:var(--lamp);border:3px solid var(--line);box-shadow:0 0 24px 8px #ffb34766;margin-top:10px;animation:fl 3s steps(2) infinite}
@keyframes fl{50%{box-shadow:0 0 30px 12px #ffb34777}}
.wrap{max-width:1000px;margin:0 auto;padding:18px 12px 40px;display:grid;gap:14px}
@media(min-width:860px){.wrap{grid-template-columns:minmax(0,1fr) 340px;align-items:start}.main{display:grid;gap:14px}}
.main{display:grid;gap:12px}
h1{margin:0;font-size:22px;font-weight:400;letter-spacing:.5px}
.box{background:var(--panel);border:4px solid var(--line);box-shadow:inset 0 0 0 3px #3a2f4d;padding:12px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.gold{color:var(--lamp);font-size:20px}
.bar{height:16px;background:var(--line);border:3px solid var(--line);position:relative;margin-top:6px}
.bar i{display:block;height:100%;background:var(--lamp);width:0}
.bar.xp i{background:var(--ok)}
.row{display:flex;justify-content:space-between;gap:8px;color:var(--dim);font-size:15px}
.orders{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.order{display:flex;align-items:center;gap:8px;background:var(--cell);border:3px solid var(--line);padding:8px;min-width:0}
.order canvas,.order img{width:40px;height:40px;image-rendering:pixelated;flex:none}
.order .t{flex:1;min-width:0;line-height:1.15}
.order .t small{display:block;color:var(--dim);font-size:13px}
button{font:inherit;color:var(--ink);background:var(--red);border:3px solid var(--line);box-shadow:0 4px 0 var(--line);padding:8px 12px;cursor:pointer;touch-action:manipulation}
button:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
button:disabled{background:#4a4058;color:#8b7f99;cursor:not-allowed}
button:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
button.go{background:#3f8f46}
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:min(100%,560px);margin:0 auto;aspect-ratio:1;touch-action:none;user-select:none;-webkit-user-select:none}
.cell{background:var(--cell);border:3px solid var(--line);display:flex;align-items:center;justify-content:center;position:relative;min-width:0}
.cell:nth-child(even){background:var(--cell2)}
.cell img{width:82%;height:82%;image-rendering:pixelated;pointer-events:none}
.cell.has{cursor:grab}
.cell.pop img{animation:pop .25s steps(4)}
.cell .lv{position:absolute;right:3px;bottom:1px;font-size:12px;color:var(--dim)}
.cell.over{outline:3px solid var(--lamp)}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.ghost{position:fixed;width:64px;height:64px;image-rendering:pixelated;pointer-events:none;z-index:50;transform:translate(-50%,-60%) scale(1.15);filter:drop-shadow(0 6px 0 #0006)}
.spawn{display:flex;gap:10px;align-items:center;justify-content:center}
.spawn button{font-size:22px;padding:12px 22px;width:min(100%,560px)}
.shop{display:grid;gap:10px}
.up{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;background:var(--cell);border:3px solid var(--line);padding:10px}
.up b{font-weight:400;font-size:17px}
.up span{color:var(--dim);font-size:13px;grid-column:1}
.up button{grid-row:1/3;grid-column:2;min-width:84px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--line);border:3px solid var(--lamp);padding:8px 16px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:90vw;text-align:center}
.toast.on{opacity:1}
details{color:var(--dim);font-size:15px}
summary{cursor:pointer}
.sp{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.sp button{padding:5px 10px;font-size:15px}
.sp button.sel{background:var(--lamp);color:#1a1020}
@media(prefers-reduced-motion:reduce){.lamp,.cell.pop img{animation:none}}
[hidden]{display:none!important}
.wrap{display:block;padding-bottom:120px}.wrap>*+*{margin-top:12px}
.home{display:grid;gap:14px}@media(min-width:860px){.home{grid-template-columns:minmax(0,1fr) 340px;align-items:start}}
.scene{border:4px solid var(--line);box-shadow:inset 0 0 0 3px #3a2f4d;background:#14121f}
.scene svg{display:block;width:100%;height:auto}
.scene.flash{animation:fx .8s steps(6)}@keyframes fx{0%,50%{filter:brightness(2)}100%{filter:none}}
.fl{animation:fk .4s steps(2) infinite}@keyframes fk{50%{transform:translateY(-1px)}}
.st{animation:sm 2s steps(4) infinite;opacity:0}.st:nth-of-type(3n+1){animation-delay:.7s}.st:nth-of-type(3n+2){animation-delay:1.4s}
@keyframes sm{0%{opacity:.7;transform:translateY(0)}100%{opacity:0;transform:translateY(-8px)}}
.fab{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:64px;height:64px;border-radius:50%;font-size:28px;padding:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.fab small{font-size:11px;margin-top:2px}.fab.r{right:18px;background:var(--red)}.fab.l{left:18px;background:#3f6fd0}
#badge{position:absolute;top:-4px;right:-4px;background:var(--lamp);color:#1a1020;border-radius:50%;min-width:24px;height:24px;font-size:15px;font-style:normal;line-height:24px;text-align:center;border:3px solid var(--line)}
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}
.modal>div{background:var(--panel);border:4px solid var(--line);box-shadow:inset 0 0 0 3px #3a2f4d;width:min(100%,420px);max-height:86vh;overflow:auto;padding:14px}
.rv{background:var(--cell);border:3px solid var(--line);padding:10px;margin-top:8px;display:grid;grid-template-columns:1fr auto;gap:4px 10px}.rv .s{color:var(--lamp)}
.lvpop{position:fixed;left:50%;top:22%;transform:translateX(-50%);background:var(--line);border:4px solid var(--lamp);padding:14px 22px;text-align:center;z-index:70;opacity:0;pointer-events:none;max-width:92vw;font-size:21px;box-shadow:0 0 40px #ffb347aa}
.lvpop small{font-size:16px;color:var(--dim)}
.lvpop.on{animation:pp 2.2s steps(11) forwards}
@keyframes pp{0%{opacity:0;transform:translateX(-50%) scale(.6)}12%{opacity:1;transform:translateX(-50%) scale(1.1)}20%{transform:translateX(-50%) scale(1)}80%{opacity:1}100%{opacity:0}}
.cell.fry{border-color:#6b4528}
@media(prefers-reduced-motion:reduce){.fl,.st,.scene.flash{animation:none}}
.stashw{width:min(100%,560px);margin:0 auto}
.stash{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:6px;touch-action:none;user-select:none;-webkit-user-select:none}
.stash .cell{aspect-ratio:1.3}.stash .cell img{width:auto;height:78%;aspect-ratio:1}
.wrap{padding-top:0}
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--panel);border:3px solid var(--line);box-shadow:inset 0 0 0 2px #3a2f4d;padding:5px 10px;display:grid;gap:3px;margin-top:6px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--panel);z-index:29}
.hr{display:flex;align-items:center;gap:8px;font-size:14px;min-height:26px}.hr span{white-space:nowrap}
.hr .bar{flex:1;margin:0;height:10px;border-width:2px;min-width:24px}
.hr .gold{font-size:17px;margin-left:auto}
.hb{width:34px;height:34px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;flex:none;background:#3f6fd0;box-shadow:0 2px 0 var(--line)}
.board{grid-template-columns:repeat(7,1fr);gap:4px;touch-action:pan-y;width:min(100%,520px)}
.board .cell{border-width:2px}.cell.has{touch-action:none}.stash{touch-action:pan-y}
.orders{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.order{flex:0 0 min(72%,230px);flex-direction:column;align-items:stretch;gap:6px;scroll-snap-align:start}
.order .oh{display:flex;align-items:center;gap:6px}.order .oh img{width:36px;height:36px}
.oi{display:flex;gap:4px}.oi img.no{opacity:.35}
.order .of{display:flex;justify-content:space-between;align-items:center;gap:6px}.nm{font-size:13px;line-height:1.2;min-width:0}
.hud{grid-template-columns:auto 1fr auto 54px;gap:4px 8px;align-items:center;padding:5px 8px}
.hud span{white-space:nowrap;font-size:14px}.hud .gold{font-size:17px;text-align:right}.hud #nx{text-align:right}
.hud .bar{margin:0;height:10px;border-width:2px;min-width:24px}#xpt{display:none}
.hb{grid-column:4;grid-row:1/3;width:54px;height:54px}
.fab2{position:fixed;left:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;font-size:26px;padding:0;z-index:20;display:flex;align-items:center;justify-content:center;line-height:1}
.toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.gens{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(calc(100% - 20px),560px);display:grid;grid-template-columns:repeat(4,1fr);gap:6px;z-index:20}
.gen{display:flex;align-items:center;justify-content:center;gap:4px;padding:6px 2px;font-size:14px;min-height:46px;white-space:nowrap}
.gen img{width:28px;height:28px;image-rendering:pixelated}.gen.lk{filter:grayscale(1) brightness(.65)}
.order{cursor:pointer}.order.rd{border-color:var(--ok);box-shadow:0 0 12px #7bc96f88;animation:pl 1.2s steps(2) infinite}.order.nr{opacity:.55}
@keyframes pl{50%{border-color:var(--lamp);box-shadow:0 0 18px #ffb347aa}}
.rv.sp{border-color:var(--lamp);background:#3a2f2a}
.dg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.dx{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--cell);padding:8px 4px;font-size:13px}
.dx img{width:40px;height:40px;image-rendering:pixelated}.dx b{font-size:28px;color:var(--dim);line-height:40px}.dx small{color:var(--dim)}.dx.nw{border-color:var(--lamp);animation:pl 1.2s steps(2) infinite}
#dbadge{position:absolute;top:-4px;right:-4px;background:var(--lamp);color:#1a1020;border-radius:50%;min-width:22px;height:22px;font-size:13px;font-style:normal;line-height:22px;text-align:center;border:3px solid var(--line)}
#boot{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .4s}#boot.off{opacity:0;pointer-events:none}
.ld{width:160px;height:14px;border:3px solid var(--line);background:var(--panel)}.ld i{display:block;height:100%;background:var(--lamp);animation:ldb .9s steps(8) forwards}@keyframes ldb{from{width:0}to{width:100%}}
@media(prefers-reduced-motion:reduce){.order.rd,.dx.nw{animation:none}}
.hud>*{min-width:0}
#lvl{grid-area:1/1}.hud .bar.xp{grid-area:1/2}.hud .gold{grid-area:1/3}#en{grid-area:2/1}.hud .bar.en{grid-area:2/2}#nx{grid-area:2/3}
.hb{grid-area:1/4/3/5;border-radius:10px;background:var(--red);flex-direction:column;gap:1px;font-size:22px;line-height:1}.hb small{font-size:11px}
textarea{width:100%;height:84px;background:var(--line);color:var(--ink);border:3px solid var(--line);font:12px monospace;padding:6px;resize:vertical}
#set h2{font-size:16px;margin:14px 0 6px;font-weight:400;color:var(--lamp)}
</style>
</head>
<body>
<div id="boot"><div style="font-size:56px">🍢</div><div style="font-size:22px">밤의 포장마차</div><div class="ld"><i></i></div></div>
<div class="wrap">
<div class="hud">
 <span id="lvl"></span><div class="bar xp"><i id="xp"></i></div><span class="gold" id="gold"></span>
 <span id="en"></span><div class="bar en"><i id="eb"></i></div><span id="nx"></span><span id="xpt"></span>

 <div id="scene" class="scene"></div>

  <div class="box"><h1 style="font-size:21px;margin-bottom:10px">포장마차 꾸미기</h1><div class="shop" id="shop"></div></div>
  
 </div>
</section>

</section>
</div>
<div id="fabs"><button class="fab l" id="toRev" aria-label="맛집 앱 리뷰">⭐<small>리뷰</small><i id="badge"></i></button><button class="fab r" id="toDex" aria-label="메뉴 도감" style="bottom:calc(92px + env(safe-area-inset-bottom,0px));background:#9a50c8">📖<small>도감</small><i id="dbadge" hidden></i></button><button class="fab r" id="toSet" aria-label="설정" style="background:#555">⚙️<small>설정</small></button></div>

 <div class="sp"><button id="bkImp" class="go">💾 데이터 불러오기</button></div>
 <h2>초기화</h2><button id="rst" style="font-size:15px">처음부터 다시 시작</button>
</div></div>

<div class="toast" id="toast"></div>
<script>
const KEY="nightStallMerge.v1";
const ITEMS={};
"1,반죽,2;2,국화빵,5;3,붕어빵,12;4,떡볶이,30;5,계란라볶이,75;6,로제라볶이,160,B,#f2a7a0,#fff1e6,#ffb3a7;7,치즈라볶이,340,B,#ffc83d,#fff3b0,#d8402f;8,모듬라볶이,720,B,#d8402f,#ffc83d,#7bc96f;11,튀김가루,2,G,#c9803a,#c9803a,#f5ecd7;12,감자튀김,5;13,고구마튀김,12;14,야채튀김,28;15,오징어튀김,65;16,새우튀김,140,P,#e8943a,#ffd27a,#fff;17,감자전,300,P,#e6c36a,#f7e3a1,#fff;18,김치전,620,P,#e0603a,#f0a050,#fff;19,해물파전,1300,P,#c9a24a,#5fb05a,#fff;20,모듬전,2800,P,#e0a030,#d8402f,#5fb05a;21,육수팩,4,G,#8a5a33,#8a5a33,#ffc83d;22,오뎅국물,10,B,#d9a35a,#f5ecd7,#f2e8d5;23,꼬치어묵,24,K,#f5ecd7,#c9a77a,#fff;24,어묵탕,55,B,#c98a4a,#f5ecd7,#f2e8d5;25,우동,120,B,#f2e0b0,#fff,#f2e8d5;26,어묵우동,260,B,#f2e0b0,#c9803a,#ffc83d;27,얼큰우동,550,B,#d8402f,#f2e0b0,#ff8a2a;28,해물우동,1150,B,#e8b080,#f08a7a,#7bc96f;29,모듬우동,2400,B,#d89a50,#d8402f,#7bc96f;30,어묵전골,5000,B,#c0402f,#ffc83d,#7bc96f;31,닭고기,6,L,#f0b090,#f7d0b8,#fff;32,간장닭꼬치,15,K,#8a4a2a,#c98a4a,#fff;33,매콤닭꼬치,35,K,#c8402f,#ff8a2a,#fff;34,핫불닭꼬치,80,K,#a02020,#ff5a1a,#fff;35,떡닭꼬치,180,K,#c8402f,#f5ecd7,#fff;36,마늘닭똥집,380,P,#c98a4a,#f5ecd7,#fff;37,닭발,800,L,#d9803a,#f0b090,#fff;38,매운닭발,1700,L,#c8402f,#ff8a2a,#fff;39,옛날통닭,3600,L,#e0a030,#ffd27a,#fff;40,닭볶음탕,7500,B,#c8402f,#f5ecd7,#7bc96f"

const RN=["야식왕","별이","퇴근길김대리","붕어맘","먹방러","새벽산책","국화빵러버","달밤손님"],
RT={5:["붕어빵이 바삭하고 팥이 가득해요!","떡볶이 국물이 진짜 진하네요","사장님 친절! 또 올게요","오징어튀김 맛집 인정입니다"],4:["맛있는데 조금 기다렸어요","분위기 좋고 양도 넉넉해요","튀김이 따끈해서 좋았어요"],3:["무난해요, 다음에 더 기대할게요","웨이팅이 좀 길었어요"]};
const SPS=["6년 연애 끝에 이별했는데 따뜻한 국물 먹고 위로 받고 갑니다...","엄마랑 같이 와서 먹었는데 어릴 때 시장에서 먹던 그 맛 그대로네요 ㅠㅠ","오늘 회사에서 너무 힘들었는데 고양이 사장님 얼굴 보고 위로 받고 가요.","야근하고 퇴근길에 들렀는데 직장 스트레스 제대로 풀립니다! 단골 할게요.","첫 월급 탄 기념으로 들렀어요. 세상에서 제일 맛있는 야식이었습니다!","비 오는 날 우산도 없이 뛰다가 들어왔는데, 사장님 인심에 마음이 녹네요."];
function addRev(){const sp=Math.random()<.38,r=Math.random()+S.upgrades.signLevel*.02,st=sp||r>.5?5:r>.2?4:3,a=sp?SPS:RT[st];
 S.reviews.push({id:Date.now(),name:RN[Math.floor(Math.random()*RN.length)],stars:st,text:a[Math.floor(Math.random()*a.length)],sp:sp?1:0});
 S.revTs=Date.now()+30000+Math.random()*30000;save();if(!$("rev").hidden)revR()}
function revR(){const l=$("rl");$("rav").textContent="★ "+(S.rcnt?(S.rsum/S.rcnt).toFixed(1):"-")+" ("+(S.rcnt||0)+")";
 l.innerHTML=S.reviews.length?"":'<p style="color:var(--dim)">새 리뷰를 기다리는 중이에요...</p>';
 S.reviews.forEach(r=>{const d=document.createElement("div");d.className="rv"+(r.sp?" sp":"");d.innerHTML=`<b>${r.name}</b><span class="s">${"★".repeat(r.stars)}${"☆".repeat(5-r.stars)}</span><span style="grid-column:1/3">${r.sp?"💌 ":""}${r.text}</span>`;
  const b=document.createElement("button");b.textContent="확인";b.className="go";b.style.gridColumn="1/3";b.onclick=()=>readRev(r.id);d.appendChild(b);l.appendChild(d)})}
function readRev(id){const i=S.reviews.findIndex(r=>r.id===id);if(i<0)return;const r=S.reviews.splice(i,1)[0];S.rsum=(S.rsum||0)+r.stars;S.rcnt=(S.rcnt||0)+1;snd([784,988]);
 if(r.sp){S.energy=Math.min(maxE(S),S.energy+2);S.gold+=20*S.level;toast("💌 사연 리뷰! 에너지 +2, "+20*S.level+" G")}
 if(Math.random()<(r.sp?.7:.35)){const e=S.board.indexOf(0),v=[1,1,2,11,11,12][Math.floor(Math.random()*6)];
  if(e<0){S.gold+=10;toast("🎁 보드가 가득 차서 10 G로 받았어요")}else{S.board[e]=v;toast("🎁 "+ITEMS[v].n+" 선물이 보드에 도착!")}}
 save();revR();hud()}
function go(n){const h=n==="home";$("home").hidden=!h;$("mergeS").hidden=h;$("fabs").hidden=!h;$("ni").textContent=h?"🍳":"🏠";$("nt").textContent=h?"조리":"복귀";$("nav").setAttribute("aria-label",h?"조리하러 가기":"포장마차로 복귀");scrollTo(0,0);render()}
$("nav").onclick=()=>{snd([392,523]);go($("home").hidden?"home":"merge")};
$("toRev").onclick=()=>{$("rev").hidden=false;revR()};$("rclose").onclick=()=>{$("rev").hidden=true};
$("rev").onclick=e=>{if(e.target.id==="rev")$("rev").hidden=true};
$("mute").checked=!!S.mute;$("mute").onchange=e=>{S.mute=e.target.checked;save()};
const LD=[659,0,784,0,880,784,659,0,587,0,659,0,784,659,587,0,523,0,659,0,784,880,784,0,440,0,523,587,659,587,523,0],
BS=[131,196,131,196,175,131,175,131,131,196,131,196,110,165,110,165];
let bT=0,bI=0,bTm=0;
function note(f,t,d,ty,v){const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0005,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}
function bTick(){while(bT<AC.currentTime+.4){const i=bI%32;if(LD[i])note(LD[i],bT,.22,"square",.03);if(i%2===0)note(BS[i>>1],bT,.4,"triangle",.07);bI++;bT+=.24}}
function startBgm(){if(S.nomusic)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state!=="running")AC.resume();if(bTm)return;bT=AC.currentTime+.1;bTm=setInterval(bTick,100)}catch(e){}}
function stopBgm(){clearInterval(bTm);bTm=0}
addEventListener("pointerup",startBgm);
document.addEventListener("visibilitychange",()=>document.hidden?stopBgm():startBgm());
$("nomusic").checked=!!S.nomusic;$("nomusic").onchange=e=>{S.nomusic=e.target.checked;save();S.nomusic?stopBgm():startBgm()};
let dexTab=0;
function dexR(){const T=$("dtabs");T.innerHTML="";["분식","튀김","국물","고기"].forEach((n,i)=>{const b=document.createElement("button");b.textContent=n;b.className=i===dexTab?"sel":"";b.onclick=()=>{dexTab=i;dexR()};T.appendChild(b)});
 const g=$("dg");g.innerHTML="";for(let k=1;k<=10;k++){const id=dexTab*10+k;if(!ITEMS[id])continue;const st=S.dex[id]||0,d=document.createElement("button");d.className="dx"+(st===1?" nw":"");
  d.innerHTML=st?`<img src="${sprite(id)}" alt=""><span>${ITEMS[id].n}</span><small>${ITEMS[id].p} G${st===1?" · NEW":""}</small>`:"<b>?</b><span>???</span>";
  d.onclick=()=>{if(st!==1)return;S.dex[id]=2;if(Math.random()<.5){S.energy=Math.min(maxE(S),S.energy+1);toast("📖 에너지 +1")}else{const gd=Math.max(10,ITEMS[id].p*2);S.gold+=gd;toast("📖 "+gd+" G 획득")}snd([988,1319]);save();dexR();hud()};g.appendChild(d)}}
$("toDex").onclick=()=>{$("dex").hidden=false;dexR()};$("dclose").onclick=()=>{$("dex").hidden=true};$("dex").onclick=e=>{if(e.target.id==="dex")$("dex").hidden=true};
setTimeout(()=>{$("boot").classList.add("off");setTimeout(()=>$("boot").remove(),500)},900);
function bkGen(){save();let t;try{t=localStorage.getItem(KEY)}catch(e){}$("bk").value=t||JSON.stringify(S)}
$("toSet").onclick=()=>{$("set").hidden=false;bkGen()};$("sclose").onclick=()=>{$("set").hidden=true};$("set").onclick=e=>{if(e.target.id==="set")$("set").hidden=true};
$("bkExp").onclick=()=>{bkGen();toast("세이브 코드를 만들었어요")};
$("bkCopy").onclick=async()=>{const t=$("bk").value;try{await navigator.clipboard.writeText(t)}catch(e){$("bk").select();try{document.execCommand("copy")}catch(_){}}toast("📋 복사했어요")};
$("bkImp").onclick=()=>{let d;try{d=JSON.parse($("bkIn").value.trim())}catch(e){return toast("올바른 백업 코드가 아니에요")}
 if(!d||typeof d!=="object"||!Array.isArray(d.board)||typeof d.gold!=="number")return toast("게임 데이터가 아니에요");
 if(!confirm("현재 데이터를 지우고 불러올까요?"))return;
 try{noSave=true;localStorage.setItem(KEY,JSON.stringify(d));location.reload()}catch(e){noSave=false;toast("저장에 실패했어요")}};
tick();speeds();render();save();
setInterval(hud,500);setInterval(save,5000);
</script>
</body>
</html>
