<!DOCTYPE html>
<html lang="ko">
<head>
     <!-- 로봇 수집 비허용 (검색 노출 차단) -->
    <meta name="robots" content="noindex, nofollow">
    <!-- 파비콘 설정 -->
    <link rel="icon" href="favicon.png" type="image/png">   
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>밤의 포장마차</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap" rel="stylesheet">
<style>
:root{--bg:#14121f;--panel:#241d33;--cell:#342a47;--cell2:#3d3253;--ink:#f2e8d5;--dim:#a99bb8;--lamp:#ffb347;--red:#c8402f;--ok:#7bc96f;--line:#0b0912;--awn1:#c8402f;--awn2:#f2e8d5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Do Hyeon','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:17px;min-height:100vh;
background-image:radial-gradient(circle at 50% -10%,#3a2a4f 0,transparent 60%)}
.awning{height:44px;background:repeating-linear-gradient(90deg,var(--awn1) 0 28px,var(--awn2) 28px 56px);border-bottom:4px solid var(--line);position:relative;margin-bottom:14px}
.awning:after{content:"";position:absolute;left:0;right:0;top:100%;height:12px;background:repeating-linear-gradient(90deg,var(--awn1) 0 28px,var(--awn2) 28px 56px);
-webkit-mask:radial-gradient(circle 14px at 14px 0,#000 98%,transparent) 0 0/28px 12px repeat-x;mask:radial-gradient(circle 14px at 14px 0,#000 98%,transparent) 0 0/28px 12px repeat-x}
.lamp{position:absolute;top:100%;width:14px;height:20px;background:var(--lamp);border:3px solid var(--line);box-shadow:0 0 24px 8px #ffb34766;margin-top:10px;animation:fl 3s steps(2) infinite}
@keyframes fl{50%{box-shadow:0 0 30px 12px #ffb34777}}
.wrap{max-width:1000px;margin:0 auto;padding:18px 12px 40px;display:grid;gap:14px}
@media(min-width:860px){.wrap{grid-template-columns:minmax(0,1fr) 340px;align-items:start}.main{display:grid;gap:14px}}
.main{display:grid;gap:12px}
h1{margin:0;font-size:26px;font-weight:400;letter-spacing:.5px}
.box{background:var(--panel);border:4px solid var(--line);box-shadow:inset 0 0 0 3px #3a2f4d;padding:12px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.gold{color:var(--lamp);font-size:24px}
.bar{height:16px;background:var(--line);border:3px solid var(--line);position:relative;margin-top:6px}
.bar i{display:block;height:100%;background:var(--lamp);width:0}
.bar.xp i{background:var(--ok)}
.row{display:flex;justify-content:space-between;gap:8px;color:var(--dim);font-size:15px}
.orders{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.order{display:flex;align-items:center;gap:8px;background:var(--cell);border:3px solid var(--line);padding:8px;min-width:0}
.order canvas,.order img{width:40px;height:40px;image-rendering:pixelated;flex:none}
.order .t{flex:1;min-width:0;line-height:1.15}
.order .t small{display:block;color:var(--dim);font-size:13px}
button{font:inherit;color:var(--ink);background:var(--red);border:3px solid var(--line);box-shadow:0 4px 0 var(--line);padding:8px 12px;cursor:pointer;touch-action:manipulation}
button:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
button:disabled{background:#4a4058;color:#8b7f99;cursor:not-allowed}
button:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
button.go{background:#3f8f46}
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:min(100%,560px);margin:0 auto;aspect-ratio:1;touch-action:none;user-select:none;-webkit-user-select:none}
.cell{background:var(--cell);border:3px solid var(--line);display:flex;align-items:center;justify-content:center;position:relative;min-width:0}
.cell:nth-child(even){background:var(--cell2)}
.cell img{width:82%;height:82%;image-rendering:pixelated;pointer-events:none}
.cell.has{cursor:grab}
.cell.pop img{animation:pop .25s steps(4)}
.cell .lv{position:absolute;right:3px;bottom:1px;font-size:12px;color:var(--dim)}
.cell.over{outline:3px solid var(--lamp)}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.ghost{position:fixed;width:64px;height:64px;image-rendering:pixelated;pointer-events:none;z-index:50;transform:translate(-50%,-60%) scale(1.15);filter:drop-shadow(0 6px 0 #0006)}
.spawn{display:flex;gap:10px;align-items:center;justify-content:center}
.spawn button{font-size:22px;padding:12px 22px;width:min(100%,560px)}
.shop{display:grid;gap:10px}
.up{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;background:var(--cell);border:3px solid var(--line);padding:10px}
.up b{font-weight:400;font-size:19px}
.up span{color:var(--dim);font-size:14px;grid-column:1}
.up button{grid-row:1/3;grid-column:2;min-width:84px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--line);border:3px solid var(--lamp);padding:8px 16px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:90vw;text-align:center}
.toast.on{opacity:1}
details{color:var(--dim);font-size:15px}
summary{cursor:pointer}
.sp{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.sp button{padding:5px 10px;font-size:15px}
.sp button.sel{background:var(--lamp);color:#1a1020}
@media(prefers-reduced-motion:reduce){.lamp,.cell.pop img{animation:none}}
[hidden]{display:none!important}
.wrap{display:block;padding-bottom:120px}.wrap>*+*{margin-top:12px}
.home{display:grid;gap:14px}@media(min-width:860px){.home{grid-template-columns:minmax(0,1fr) 340px;align-items:start}}
.scene{border:4px solid var(--line);box-shadow:inset 0 0 0 3px #3a2f4d;background:#14121f}
.scene svg{display:block;width:100%;height:auto}
.scene.flash{animation:fx .8s steps(6)}@keyframes fx{0%,50%{filter:brightness(2)}100%{filter:none}}
.fl{animation:fk .4s steps(2) infinite}@keyframes fk{50%{transform:translateY(-1px)}}
.st{animation:sm 2s steps(4) infinite;opacity:0}.st:nth-of-type(3n+1){animation-delay:.7s}.st:nth-of-type(3n+2){animation-delay:1.4s}
@keyframes sm{0%{opacity:.7;transform:translateY(0)}100%{opacity:0;transform:translateY(-8px)}}
.fab{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:78px;height:78px;border-radius:50%;font-size:34px;padding:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.fab small{font-size:13px;margin-top:2px}.fab.r{right:18px;background:var(--red)}.fab.l{left:18px;background:#3f6fd0}
#badge{position:absolute;top:-4px;right:-4px;background:var(--lamp);color:#1a1020;border-radius:50%;min-width:24px;height:24px;font-size:15px;font-style:normal;line-height:24px;text-align:center;border:3px solid var(--line)}
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}
.modal>div{background:var(--panel);border:4px solid var(--line);box-shadow:inset 0 0 0 3px #3a2f4d;width:min(100%,420px);max-height:86vh;overflow:auto;padding:14px}
.rv{background:var(--cell);border:3px solid var(--line);padding:10px;margin-top:8px;display:grid;grid-template-columns:1fr auto;gap:4px 10px}.rv .s{color:var(--lamp)}
.lvpop{position:fixed;left:50%;top:22%;transform:translateX(-50%);background:var(--line);border:4px solid var(--lamp);padding:14px 22px;text-align:center;z-index:70;opacity:0;pointer-events:none;max-width:92vw;font-size:21px;box-shadow:0 0 40px #ffb347aa}
.lvpop small{font-size:16px;color:var(--dim)}
.lvpop.on{animation:pp 2.2s steps(11) forwards}
@keyframes pp{0%{opacity:0;transform:translateX(-50%) scale(.6)}12%{opacity:1;transform:translateX(-50%) scale(1.1)}20%{transform:translateX(-50%) scale(1)}80%{opacity:1}100%{opacity:0}}
.cell.fry{border-color:#6b4528}
@media(prefers-reduced-motion:reduce){.fl,.st,.scene.flash{animation:none}}
.stashw{width:min(100%,560px);margin:0 auto}
.stash{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:6px;touch-action:none;user-select:none;-webkit-user-select:none}
.stash .cell{aspect-ratio:1.3}.stash .cell img{width:auto;height:78%;aspect-ratio:1}
.wrap{padding-top:0}
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--panel);border:3px solid var(--line);box-shadow:inset 0 0 0 2px #3a2f4d;padding:5px 10px;display:grid;gap:3px;margin-top:6px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--panel);z-index:29}
.hr{display:flex;align-items:center;gap:8px;font-size:14px;min-height:26px}.hr span{white-space:nowrap}
.hr .bar{flex:1;margin:0;height:10px;border-width:2px;min-width:24px}
.hr .gold{font-size:17px;margin-left:auto}
.hb{width:34px;height:34px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;flex:none;background:#3f6fd0;box-shadow:0 2px 0 var(--line)}
.board{grid-template-columns:repeat(7,1fr);gap:4px;touch-action:pan-y;width:min(100%,520px)}
.board .cell{border-width:2px}.cell.has{touch-action:none}.stash{touch-action:pan-y}
.orders{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.order{flex:0 0 min(72%,230px);flex-direction:column;align-items:stretch;gap:6px;scroll-snap-align:start}
.order .oh{display:flex;align-items:center;gap:6px}.order .oh img{width:36px;height:36px}
.oi{display:flex;gap:4px}.oi img.no{opacity:.35}
.order .of{display:flex;justify-content:space-between;align-items:center;gap:6px}.nm{font-size:13px;line-height:1.2;min-width:0}
.hud{grid-template-columns:auto 1fr auto 54px;gap:4px 8px;align-items:center;padding:5px 8px}
.hud span{white-space:nowrap;font-size:14px}.hud .gold{font-size:17px;text-align:right}.hud #nx{text-align:right}
.hud .bar{margin:0;height:10px;border-width:2px;min-width:24px}#xpt{display:none}
.hb{grid-column:4;grid-row:1/3;width:54px;height:54px}
.fab2{position:fixed;left:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;font-size:26px;padding:0;z-index:20;display:flex;align-items:center;justify-content:center;line-height:1}
</style>
</head>
<body>
<div class="wrap">
<div class="hud">
 <span id="lvl"></span><div class="bar xp"><i id="xp"></i></div><span class="gold" id="gold"></span>
 <button class="hb" id="back" hidden aria-label="포장마차로 돌아가기"><svg viewBox="0 0 16 16" width="34" height="34" shape-rendering="crispEdges"><rect x="1" y="2" width="14" height="5" fill="#c8402f"/><rect x="3" y="2" width="2" height="5" fill="#f2e8d5"/><rect x="7" y="2" width="2" height="5" fill="#f2e8d5"/><rect x="11" y="2" width="2" height="5" fill="#f2e8d5"/><rect x="2" y="7" width="1" height="7" fill="#5a3a22"/><rect x="13" y="7" width="1" height="7" fill="#5a3a22"/><rect x="2" y="10" width="12" height="4" fill="#8a5a33"/><rect x="7" y="8" width="2" height="2" fill="#ffb347"/></svg></button>
 <span id="en"></span><div class="bar"><i id="eb"></i></div><span id="nx"></span><span id="xpt"></span>
</div>
<section id="home" class="home">
 <div id="scene" class="scene"></div>
 <div>
  <div class="box"><h1 style="font-size:21px;margin-bottom:10px">포장마차 꾸미기</h1><div class="shop" id="shop"></div></div>
  <div class="box" style="margin-top:14px"><details><summary>설정</summary><div class="sp" id="speeds"></div><label><input type="checkbox" id="mute"> 효과음 끄기</label><br><label><input type="checkbox" id="nomusic"> 배경음악 끄기</label><br><br><button id="rst" style="font-size:15px">처음부터 다시 시작</button></details></div>
 </div>
</section>
<section id="mergeS" class="main" hidden>
 <button id="sp" class="go fab2" aria-label="재료 만들기 (에너지 1 사용)">⚡</button>
 <div class="row"><span>대기 손님 <b id="oc"></b></span><span>← 옆으로 넘겨보세요 →</span></div>
 <div class="orders" id="orders"></div>
 <div class="board" id="board" aria-label="머지 보드"></div>
 <div class="stashw"><div class="row"><span>보관함 (드래그해서 넣고 빼요)</span><span id="stc"></span></div><div class="stash" id="stash" aria-label="보관함"></div></div>
</section>
</div>
<div id="fabs"><button class="fab l" id="toRev" aria-label="맛집 앱 리뷰">⭐<small>리뷰</small><i id="badge"></i></button><button class="fab r" id="toMerge" aria-label="조리하러 가기">🍳<small>조리</small></button></div>
<div class="modal" id="rev" hidden><div><div class="top"><h1 style="font-size:22px">냠냠랭크</h1><span class="gold" id="rav"></span></div><div id="rl"></div><button id="rclose" style="margin-top:12px">닫기</button></div></div>
<div class="lvpop" id="lvpop"></div>
<div class="toast" id="toast"></div>
<script>
const KEY="nightStallMerge.v1";
const ITEMS={1:{n:"반죽",p:2},2:{n:"국화빵",p:5},3:{n:"붕어빵",p:12},4:{n:"떡볶이",p:30},5:{n:"계란라볶이",p:75},11:{n:"감자튀김",p:3},12:{n:"고구마튀김",p:7},13:{n:"야채튀김",p:16},14:{n:"오징어튀김",p:40}};
const PAL={o:"#3b2a20",w:"#f5ecd7",y:"#ffc83d",b:"#c9803a",r:"#d8402f",p:"#f08a7a",f:"#f0c4a0",e:"#2a1d18"};
const SPR=[null,
["........","........","..oooo..",".owwwwo.","owwwwwwo","owwwwwwo",".owwwwo.","..oooo.."],
["..b.bb.b",".bbbbbbb","bbyyyybb",".byyyybb","bbyyyybb",".bbbbbbb","..b.bb.b","........"],
["........","..bbbb.b",".bbbbbbb","bebbbbbb",".bbbbbbb","..bbbb.b","........","........"],
["..o..o..",".rrrrrr.","rrprrrpr","rrrrrrrr","oooooooo",".owwwwo.","..owwo..","........"],
["..wwww..",".wwyywr.","rrwyywrr","rrrrrrrr","oooooooo",".owwwwo.","..oooo..","........"]];
PAL.v="#8a4fb0";PAL.g="#5fb05a";
SPR[11]=["...y.y..","..yyyyy.",".yyyyyy.","..yyyy..","orrrrrro","orrrrrro",".orrrro.","........"];
SPR[12]=["........",".vvvvv..","vvyyyvvv","vyyyyyyv","vvyyyvvv",".vvvvv..","........","........"];
SPR[13]=["..g.g...",".bgbbgb.","bbgbbbgb","bgbbyybb","bbbbbbbb",".bbbbbb.","..oooo..","........"];
SPR[14]=["..bbbb..",".bbbbbb.","bbwbbwbb","bbbbbbbb",".bbbbbb.",".b.bb.b.",".b.bb.b.","b..bb..b"];
const CUST=["..hhhh..",".hhhhhh.",".ffffff.",".feffeff"[0]+"feffef.","..ffff..","..cccc..",".cccccc.",".cccccc."];
CUST[3]=".feffef.";
const cache={};
function draw(rows,extra){const k=rows.join()+JSON.stringify(extra||{});if(cache[k])return cache[k];
 const c=document.createElement("canvas");c.width=8;c.height=8;const x=c.getContext("2d");
 rows.forEach((r,j)=>[...r].forEach((ch,i)=>{const col=(extra&&extra[ch])||PAL[ch];if(col){x.fillStyle=col;x.fillRect(i,j,1,1)}}));
 return cache[k]=c.toDataURL()}
const sprite=i=>draw(SPR[i]);
const HAIR=["#2a1d18","#7a4a2a","#d9d9d9","#c8402f"],SHIRT=["#3f8fd0","#7bc96f","#b070d0","#ffb347"];
const cust=n=>draw(CUST,{h:HAIR[n%4],c:SHIRT[(n+1)%4]});
const AWN=[["#c8402f","#f2e8d5"],["#2f8f6a","#f2e8d5"],["#3f6fd0","#f2e8d5"],["#d09a2f","#2a1d18"],["#9a50c8","#f2e8d5"]];
const UPS={
 stoveLevel:{n:"가스 화구",base:100,d:s=>`충전 ${Math.round(Math.max(60,120*(1-.03*(s.upgrades.stoveLevel-1))))}초당 1개`},
 toolLevel:{n:"조리 도구",base:150,d:s=>`생성 시 국화빵 확률 ${Math.min(60,5*s.upgrades.toolLevel)}%`},
 tentLevel:{n:"포장마차 천막",base:120,d:s=>`에너지 최대 ${maxE(s)}`},
 signLevel:{n:"메뉴판/조명",base:200,d:s=>`서빙 골드 +${5*(s.upgrades.signLevel-1)}%`}
};
const MAXLV=20,mxl=k=>k==="stashLevel"?4:MAXLV;
const SL=s=>6+s.upgrades.stashLevel;
UPS.stashLevel={n:"보관함",base:150,d:s=>"슬롯 "+SL(s)+"칸"};
const maxE=s=>100+10*(s.upgrades.tentLevel-1);
const itv=s=>Math.max(60,120*(1-.03*(s.upgrades.stoveLevel-1)));
const cost=(k,s)=>Math.round(UPS[k].base*Math.pow(1.7,s.upgrades[k]-1));
const bonus=s=>1+.05*(s.upgrades.signLevel-1);
let nid=1;
const maxC=()=>Math.min(8,2+Math.floor(S.level/2));
function fillOrders(){while(S.orders.length<maxC())S.orders.push(newOrder(S))}
function newOrder(s){const hi=Math.min(5,3+Math.floor(s.level/3)),p=Object.keys(ITEMS).map(Number).filter(v=>v%10>=2&&v%10<=hi),
 m=s.level>=8?3:s.level>=4?2:1,n=1+Math.floor(Math.random()*m),items=[];
 for(let i=0;i<n;i++)items.push(p[Math.floor(Math.random()*p.length)]);
 return{id:nid++,items,rewardGold:items.reduce((a,t)=>a+ITEMS[t].p,0),face:Math.floor(Math.random()*16)}}
function fresh(){const s={gold:100,exp:0,level:1,energy:100,charge:0,lastSavedTimestamp:Date.now(),board:Array(49).fill(0),orders:[],upgrades:{stoveLevel:1,toolLevel:1,tentLevel:1,signLevel:1},speed:1};
 s.board[1]=1;s.board[3]=2;s.orders=[newOrder(s),newOrder(s)];return s}
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
if(S&&Array.isArray(S.board)&&S.board.length===25){const nb=Array(49).fill(0);S.board.forEach((v,i)=>nb[Math.floor(i/5)*7+i%5]=v);S.board=nb}
if(!S||!Array.isArray(S.board)||S.board.length!==49)S=fresh();
S.charge=S.charge||0;S.reviews=S.reviews||[];S.upgrades.stashLevel=S.upgrades.stashLevel||1;S.stash=S.stash||[];while(S.stash.length<10)S.stash.push(0);S.revTs=S.revTs||0;S.speed=S.speed||1;
S.orders.forEach(o=>{if(!o.items)o.items=[o.targetItem]});nid=Math.max(nid,1,...S.orders.map(o=>o.id+1));fillOrders();
function save(){S.lastSavedTimestamp=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let last=S.lastSavedTimestamp||Date.now();
function tick(){const now=Date.now();let dt=Math.max(0,(now-last)/1000)*S.speed;last=now;
 const m=maxE(S);if(S.energy>=m){S.energy=Math.min(S.energy,m);S.charge=0;return}
 S.charge+=dt;const n=Math.floor(S.charge/itv(S));
 if(n){S.energy=Math.min(m,S.energy+n);S.charge-=n*itv(S)}
 if(S.energy>=m)S.charge=0}
const $=id=>document.getElementById(id);
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),1600)}
const need=s=>s.level*30;
function hud(){tick();const m=maxE(S);
 $("gold").textContent=S.gold.toLocaleString()+" G";
 $("lvl").textContent="Lv."+S.level;$("xpt").textContent=S.exp+"/"+need(S);
 $("xp").style.width=(S.exp/need(S)*100)+"%";
 $("en").textContent="⚡ "+S.energy+" / "+m;$("eb").style.width=(S.energy/m*100)+"%";
 const rem=Math.ceil((itv(S)-S.charge)/S.speed);
 $("nx").textContent=S.energy>=m?"MAX":"+1 "+Math.floor(rem/60)+":"+String(rem%60).padStart(2,"0");
 $("sp").disabled=S.energy<1;
 if(S.reviews.length<3&&Date.now()>S.revTs)addRev();
 $("badge").textContent=S.reviews.length;$("badge").hidden=!S.reviews.length;
 const t=Math.floor((S.upgrades.tentLevel-1)/3)%AWN.length;
 document.documentElement.style.setProperty("--awn1",AWN[t][0]);document.documentElement.style.setProperty("--awn2",AWN[t][1]);
 document.querySelectorAll("[data-up]").forEach(b=>{b.disabled=S.upgrades[b.dataset.up]>=mxl(b.dataset.up)||S.gold<cost(b.dataset.up,S)})}
function sceneSVG(){const u=S.upgrades,[A,B]=AWN[Math.floor((u.tentLevel-1)/3)%AWN.length],ax=16-2*Math.min(6,Math.floor(u.tentLevel/3)),w=160-2*ax;
 const R=(x,y,w,h,f,c)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${f}"${c?` class="${c}"`:""}/>`;
 let s='<svg viewBox="0 0 160 100" shape-rendering="crispEdges" role="img" aria-label="내 포장마차">'+R(0,0,160,100,"#14121f")+R(0,84,160,16,"#2a2238");
 [[10,8],[40,14],[90,6],[130,12],[150,24],[70,20],[110,16]].forEach(p=>s+=R(p[0],p[1],1,1,"#f2e8d5"));
 s+=R(ax+2,36,3,48,"#5a3a22")+R(160-ax-5,36,3,48,"#5a3a22");
 for(let i=0;i<w/4;i++){const c=Math.floor(i/2)%2?B:A;s+=R(ax+i*4,26,4,12,c)+R(ax+i*4,38,4,Math.floor(i/2)%2?2:3,c)}
 const n=Math.min(6,1+Math.floor(u.tentLevel/2));
 for(let i=0;i<n;i++){const x=Math.round(ax+8+(w-16)*(i+.5)/n);s+=`<rect x="${x-5}" y="42" width="11" height="12" fill="#ffb347" opacity=".25"/>`+R(x,41,1,3,"#555")+R(x-2,44,5,6,"#ffb347")+R(x-1,45,3,4,"#fff1b8")}
 s+=R(ax+4,60,w-8,24,"#6b4528")+R(ax+4,60,w-8,3,"#8a5a33");
 const x0=ax+8,h=3+Math.min(3,Math.floor(u.stoveLevel/6));
 s+=R(x0,54,28,6,"#2b2b33");
 for(let i=0;i<Math.min(5,1+Math.floor(u.stoveLevel/4));i++)s+=R(x0+2+i*5,54-h,3,h,"#ff8a2a","fl")+R(x0+3+i*5,55-h,1,h-1,"#ffd84a","fl");
 s+=R(x0+2,44,24,5,"#c8402f")+R(x0,45,2,3,"#8a2a1f")+R(x0+26,45,2,3,"#8a2a1f");
 for(let i=0;i<3;i++)s+=R(x0+6+i*8,41,2,3,"#f2e8d5","st");
 const TC=[["#8a8a96","#555"],["#333","#c9803a"],["#d8c9a0","#a99060"],["#e0a030","#7a4a10"],["#aab","#667"]];
 for(let i=0;i<Math.min(5,1+Math.floor(u.toolLevel/4));i++){const x=ax+42+i*11;s+=R(x,55,10,5,TC[i][0])+R(x,52,10,3,TC[i][1])}
 const sx=160-ax-40,L=Math.min(10,2+u.signLevel);
 s+=R(sx,63,32,18,"#1b1626")+R(sx+2,65,28,14,"#2f2640");
 for(let i=0;i<10;i++)s+=R(sx+1+(i%5)*7,i<5?63:79,2,2,i<L?"#ffd84a":"#5a4a3a");
 return s+`<text x="${sx+16}" y="74" font-size="6" fill="#ffb347" text-anchor="middle" font-family="Do Hyeon,sans-serif">메뉴판</text></svg>`}
function render(pop){
 $("scene").innerHTML=sceneSVG();
 const b=$("board");b.innerHTML="";
 S.board.forEach((v,i)=>{const c=document.createElement("div");c.className="cell"+(v?" has":"")+(v>10?" fry":"")+(pop===i?" pop":"");c.dataset.i=i;
  if(v)c.innerHTML=`<img src="${sprite(v)}" alt="${ITEMS[v].n}"><span class="lv">${v%10}</span>`;b.appendChild(c)});
 const sb=$("stash");sb.innerHTML="";const sn=SL(S);let used=0;
 for(let j=0;j<sn;j++){const v=S.stash[j]||0;if(v)used++;const c=document.createElement("div");c.className="cell"+(v?" has":"")+(v>10?" fry":"")+(pop===100+j?" pop":"");c.dataset.i=100+j;
  if(v)c.innerHTML=`<img src="${sprite(v)}" alt="${ITEMS[v].n}"><span class="lv">${v%10}</span>`;sb.appendChild(c)}
 $("stc").textContent=used+" / "+sn;
 const o=$("orders"),sx=o.scrollLeft;o.innerHTML="";$("oc").textContent=S.orders.length+"/"+maxC();
 S.orders.forEach(od=>{const b=S.board.slice(),ok=od.items.map(t=>{const i=b.indexOf(t);if(i>=0)b[i]=0;return i>=0}),d=document.createElement("div");d.className="order";
  d.innerHTML=`<div class="oh"><img src="${cust(od.face)}" alt="손님"><div class="oi">${od.items.map((t,k)=>`<img src="${sprite(t)}" alt="${ITEMS[t].n}" class="${ok[k]?"ok":"no"}">`).join("")}</div></div><div class="of"><span class="nm">${od.items.map(t=>ITEMS[t].n).join(", ")}<br><small>${Math.round(od.rewardGold*bonus(S))} G</small></span></div>`;
  const bt=document.createElement("button");bt.textContent="서빙";bt.className="go";bt.disabled=!ok.every(x=>x);bt.onclick=()=>serve(od.id);d.querySelector(".of").appendChild(bt);o.appendChild(d)});
 o.scrollLeft=sx;
 const sh=$("shop");sh.innerHTML="";
 for(const k in UPS){const u=UPS[k],d=document.createElement("div");d.className="up";const mx=S.upgrades[k]>=mxl(k);
  d.innerHTML=`<b>${u.n} Lv.${S.upgrades[k]}</b><span>${u.d(S)}</span>`;
  const bt=document.createElement("button");bt.dataset.up=k;bt.textContent=mx?"최대":cost(k,S)+" G";bt.onclick=()=>upgrade(k);d.appendChild(bt);sh.appendChild(d)}
 hud()}
let AC;function snd(ns,t=.09){if(S.mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();ns.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain(),a=AC.currentTime+i*t;o.type="square";o.frequency.value=f;g.gain.setValueAtTime(.06,a);g.gain.exponentialRampToValueAtTime(.001,a+t*.95);o.connect(g);g.connect(AC.destination);o.start(a);o.stop(a+t)})}catch(e){}}
function pop(h){const e=$("lvpop");e.innerHTML=h;e.classList.remove("on");void e.offsetWidth;e.classList.add("on")}
function spawn(){if(S.energy<1)return toast("에너지가 부족해요");
 let e=S.board.indexOf(0);if(e<0){const j=S.stash.slice(0,SL(S)).indexOf(0);if(j<0)return toast("보드와 보관함이 가득 찼어요");e=100+j;toast("보드가 가득 차서 보관함에 넣었어요")}
 const base=Math.random()<.6?1:11;S.energy--;sv(e,Math.random()<Math.min(.6,.05*S.upgrades.toolLevel)?base+1:base);snd([440]);save();render(e)}
function serve(id){const od=S.orders.find(o=>o.id===id);if(!od)return;const b=S.board.slice(),idx=[];
 for(const t of od.items){const i=b.indexOf(t);if(i<0)return toast("보드에 메뉴가 부족해요");b[i]=0;idx.push(i)}
 idx.forEach(i=>S.board[i]=0);snd([880,1175]);S.gold+=Math.round(od.rewardGold*bonus(S));S.exp+=od.items.reduce((a,t)=>a+(t%10)*5,0);
 while(S.exp>=need(S)){S.exp-=need(S);S.level++;S.energy=Math.min(maxE(S),S.energy+5);toast("레벨 업! 에너지 +5")}
 S.orders=S.orders.map(o=>o.id===id?newOrder(S):o);fillOrders();save();render()}
function upgrade(k){const c=cost(k,S);if(S.gold<c||S.upgrades[k]>=mxl(k))return;const b=UPS[k].d(S),t0=Math.floor((S.upgrades.tentLevel-1)/3);
 S.gold-=c;S.upgrades[k]++;if(k==="tentLevel")S.energy=Math.min(maxE(S),S.energy+10);
 const a=UPS[k].d(S);save();render();
 const sc=$("scene");sc.classList.remove("flash");void sc.offsetWidth;sc.classList.add("flash");
 pop(`✨ ${UPS[k].n} Lv.${S.upgrades[k]}<br><small>${b} → ${a}</small>`+(k==="tentLevel"&&Math.floor((S.upgrades.tentLevel-1)/3)>t0?"<br><small>천막이 새 단장했어요!</small>":""));
 snd([523,659,784,1047])}
const gv=i=>i>=100?S.stash[i-100]||0:S.board[i],sv=(i,v)=>{if(i>=100)S.stash[i-100]=v;else S.board[i]=v};
function drop(a,b){if(b===a||isNaN(b))return render();const A=gv(a),B=gv(b);
 if(!B){sv(b,A);sv(a,0);save();render();return}
 if(A===B&&ITEMS[A+1]){sv(b,A+1);sv(a,0);snd([660,880]);save();render(b);return}
 sv(a,B);sv(b,A);save();render()}
let drag=null;
["board","stash"].forEach(id=>$(id).addEventListener("pointerdown",e=>{const c=e.target.closest(".cell");if(!c)return;const i=+c.dataset.i;if(!gv(i))return;
 e.preventDefault();const g=document.createElement("img");g.src=sprite(gv(i));g.className="ghost";document.body.appendChild(g);
 drag={i,g};c.style.opacity=.35;mv(e)}));
function mv(e){if(!drag)return;drag.g.style.left=e.clientX+"px";drag.g.style.top=e.clientY+"px";
 document.querySelectorAll(".cell.over").forEach(x=>x.classList.remove("over"));
 const t=document.elementFromPoint(e.clientX,e.clientY),c=t&&t.closest&&t.closest(".cell");if(c)c.classList.add("over")}
addEventListener("pointermove",mv);
function up(e){if(!drag)return;const t=document.elementFromPoint(e.clientX,e.clientY),c=t&&t.closest&&t.closest(".cell");
 const from=drag.i;drag.g.remove();drag=null;if(c)drop(from,+c.dataset.i);else render()}
addEventListener("pointerup",up);addEventListener("pointercancel",()=>{if(drag){drag.g.remove();drag=null;render()}});
$("sp").onclick=spawn;
const SPD=[1,5,20,60];
function speeds(){const w=$("speeds");w.innerHTML="";SPD.forEach(v=>{const b=document.createElement("button");b.textContent="×"+v;b.className=S.speed===v?"sel":"";
 b.onclick=()=>{tick();S.speed=v;save();speeds();toast("충전 속도 ×"+v)};w.appendChild(b)})}
$("rst").onclick=()=>{if(confirm("저장 데이터를 지우고 처음부터 시작할까요?")){S=fresh();last=Date.now();save();speeds();render()}};
document.addEventListener("visibilitychange",()=>{if(document.hidden)save();else{tick();render()}});
addEventListener("pagehide",save);
const RN=["야식왕","별이","퇴근길김대리","붕어맘","먹방러","새벽산책","국화빵러버","달밤손님"],
RT={5:["붕어빵이 바삭하고 팥이 가득해요!","떡볶이 국물이 진짜 진하네요","사장님 친절! 또 올게요","오징어튀김 맛집 인정입니다"],4:["맛있는데 조금 기다렸어요","분위기 좋고 양도 넉넉해요","튀김이 따끈해서 좋았어요"],3:["무난해요, 다음에 더 기대할게요","웨이팅이 좀 길었어요"]};
function addRev(){const r=Math.random()+S.upgrades.signLevel*.02,st=r>.5?5:r>.2?4:3,a=RT[st];
 S.reviews.push({id:Date.now(),name:RN[Math.floor(Math.random()*RN.length)],stars:st,text:a[Math.floor(Math.random()*a.length)]});
 S.revTs=Date.now()+30000+Math.random()*30000;save();if(!$("rev").hidden)revR()}
function revR(){const l=$("rl");$("rav").textContent="★ "+(S.rcnt?(S.rsum/S.rcnt).toFixed(1):"-")+" ("+(S.rcnt||0)+")";
 l.innerHTML=S.reviews.length?"":'<p style="color:var(--dim)">새 리뷰를 기다리는 중이에요...</p>';
 S.reviews.forEach(r=>{const d=document.createElement("div");d.className="rv";d.innerHTML=`<b>${r.name}</b><span class="s">${"★".repeat(r.stars)}${"☆".repeat(5-r.stars)}</span><span style="grid-column:1/3">${r.text}</span>`;
  const b=document.createElement("button");b.textContent="확인";b.className="go";b.style.gridColumn="1/3";b.onclick=()=>readRev(r.id);d.appendChild(b);l.appendChild(d)})}
function readRev(id){const i=S.reviews.findIndex(r=>r.id===id);if(i<0)return;const r=S.reviews.splice(i,1)[0];S.rsum=(S.rsum||0)+r.stars;S.rcnt=(S.rcnt||0)+1;snd([784,988]);
 if(Math.random()<.35){const e=S.board.indexOf(0),v=[1,1,2,11,11,12][Math.floor(Math.random()*6)];
  if(e<0){S.gold+=10;toast("🎁 보드가 가득 차서 10 G로 받았어요")}else{S.board[e]=v;toast("🎁 "+ITEMS[v].n+" 선물이 보드에 도착!")}}
 save();revR();hud()}
function go(n){const h=n==="home";$("home").hidden=!h;$("mergeS").hidden=h;$("fabs").hidden=!h;$("back").hidden=h;scrollTo(0,0);render()}
$("toMerge").onclick=()=>{snd([392,523]);go("merge")};$("back").onclick=()=>go("home");
$("toRev").onclick=()=>{$("rev").hidden=false;revR()};$("rclose").onclick=()=>{$("rev").hidden=true};
$("rev").onclick=e=>{if(e.target.id==="rev")$("rev").hidden=true};
$("mute").checked=!!S.mute;$("mute").onchange=e=>{S.mute=e.target.checked;save()};
const LD=[659,0,784,0,880,784,659,0,587,0,659,0,784,659,587,0,523,0,659,0,784,880,784,0,440,0,523,587,659,587,523,0],
BS=[131,196,131,196,175,131,175,131,131,196,131,196,110,165,110,165];
let bT=0,bI=0,bTm=0;
function note(f,t,d,ty,v){const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0005,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}
function bTick(){while(bT<AC.currentTime+.4){const i=bI%32;if(LD[i])note(LD[i],bT,.22,"square",.03);if(i%2===0)note(BS[i>>1],bT,.4,"triangle",.07);bI++;bT+=.24}}
function startBgm(){if(S.nomusic)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state!=="running")AC.resume();if(bTm)return;bT=AC.currentTime+.1;bTm=setInterval(bTick,100)}catch(e){}}
function stopBgm(){clearInterval(bTm);bTm=0}
addEventListener("pointerup",startBgm);
document.addEventListener("visibilitychange",()=>document.hidden?stopBgm():startBgm());
$("nomusic").checked=!!S.nomusic;$("nomusic").onchange=e=>{S.nomusic=e.target.checked;save();S.nomusic?stopBgm():startBgm()};
tick();speeds();render();save();
setInterval(hud,500);setInterval(save,5000);
</script>
